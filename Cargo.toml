[workspace]
members = [
    "crates/bytewaves-core",
    "crates/bytewaves-python",
    "crates/bytewaves-wasm",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tacio/bytewaves"

[workspace.dependencies]
bytewaves-core = { path = "crates/bytewaves-core" }
crc32fast = "1.5"
reed-solomon = "0.2.1"
serde = { version = "1", features = ["derive"] }

