[package]
name = "bytewaves-python"
description = "Python bindings for the ByteWaves modem core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
bytewaves-core.workspace = true
numpy = "0.23"
pyo3 = { version = "0.23", features = ["extension-module"] }
serde_json = "1"

