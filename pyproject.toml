[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "bytewaves"
version = "0.1.0"
description = "An acoustic modem for transmitting data using sound waves, with Reed-Solomon error correction."
authors = [
    { name = "Tacio" }
]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["acoustic-modem", "audio", "data-transmission", "mfsk", "reed-solomon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "numpy>=2.3.3",
    "reedsolo>=1.7.0",
    "sounddevice>=0.5.2",
    "padasip>=1.2.1",
]

[project.urls]
Homepage = "https://github.com/tacio/bytewaves"
Repository = "https://github.com/tacio/bytewaves"
Issues = "https://github.com/tacio/bytewaves/issues"

[project.optional-dependencies]
dev = [
    "psutil>=5.9",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.7.0",
    "ty",
]

[dependency-groups]
dev = [
    "psutil>=5.9",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.7.0",
    "ty",
]

[tool.ruff]
exclude = ["pyproject.toml", "CVS", ".git", ".hg", ".DS_Store"]

# [tool.flake8] moved to ruff
# [tool.black] moved to ruff
# [tool.mypy] moved to ty

[project.scripts]
bytewaves = "bytewaves.modem:main"

[tool.hatch.build.targets.sdist]
include = [
    "/bytewaves",
    "/README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["bytewaves"]
